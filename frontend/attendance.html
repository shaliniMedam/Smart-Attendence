<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance - Smart Attendance</title>
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="sidebar-logo">🎓 Smart Attendance</div>
        <ul class="sidebar-links">
            <li><a href="index.html"><span class="icon">📊</span> Dashboard</a></li>
            <li><a href="register.html"><span class="icon">📝</span> Register</a></li>
            <li><a href="attendance.html" class="active"><span class="icon">📸</span> Attendance</a></li>
            <li><a href="history.html"><span class="icon">📅</span> History</a></li>
        </ul>
        <ul class="sidebar-links sidebar-bottom">
            <li><a href="settings.html"><span class="icon">⚙️</span> Settings</a></li>
        </ul>
    </div>

    <!-- Main Content Wrapper -->
    <div class="main-content">
    <div class="container">
        <div class="card" style="max-width: 800px; margin: 0 auto;">
            <div class="card-header">
                <h2 class="card-title">📸 Mark Attendance</h2>
                <span style="color: var(--gray);">Position your face in the frame</span>
            </div>

            <!-- Camera Section -->
            <div class="camera-container">
                <video id="camera" autoplay playsinline></video>
                <canvas id="captureCanvas" style="display:none;"></canvas>
            </div>

            <!-- Image Preview -->
            <img id="imagePreview" class="preview-image" style="display:none;" alt="Preview">

            <!-- Camera status and restart -->
            <div class="camera-controls" style="margin-top: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 1rem;">
                <div id="cameraStatus" style="font-size: 1.2rem; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 0.5rem;">
                    🤖 Auto-scanning active... Position your face inside the frame.
                </div>
                <button class="btn btn-outline" style="padding: 0.5rem 1.5rem; font-size: 0.9rem;" onclick="startCamera('camera')">
                    🔄 Restart Camera
                </button>
            </div>

            <!-- Recognition Result -->
            <div id="recognitionResult" style="display:none;"></div>
            
            <!-- Liveness Status -->
            <div id="liveness-status" style="display:none; margin-top: 1rem; padding: 1rem; border-radius: 8px; text-align: center; font-weight: 600;"></div>
        </div>

        <!-- Export Section -->
        <div class="card" style="max-width: 800px; margin: 2rem auto;">
            <div class="card-header">
                <h2 class="card-title">📥 Export Attendance</h2>
            </div>
            <div style="display:flex;gap:1rem;align-items:flex-end;">
                <div class="form-group" style="flex:1;margin-bottom:0;">
                    <label for="exportDate">Select Date</label>
                    <input type="date" id="exportDate" class="form-control">
                </div>
                <button class="btn btn-primary" onclick="exportAttendance()">📥 Export CSV</button>
            </div>
        </div>
    </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
